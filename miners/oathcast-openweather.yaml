# DRAFT ONLY — replace id/base_url and validate against a live node before registration.
# OpenWeather pop is kept as a distinct provider signal, but its exact event
# threshold equivalence is not asserted until held-out validation.
version: "1"
kind: miner
id: 0
slug: oathcast-openweather
protocol: generic
name: OathCast OpenWeather One Call Forecaster
description: OpenWeather One Call-backed one-hour precipitation probability with deterministic text output.
base_url: https://REPLACE-openweather-adapter.example

auth:
  type: bearer
  header_name: Authorization
  value_prefix: "Bearer "
  env_var: OATHCAST_MINER_API_KEY

endpoints:
  - path: /predict
    external_path: /v1/forecast/point
    method: GET
    description: Forecast one UTC hour without cross-hour probability aggregation.
    param_map:
      lat: latitude
      lon: longitude
      start: horizon_start
      end: horizon_end

semantics:
  signal_mapping:
    confidence_field: probability
    reason_field: content
  supported_intents:
    - WEATHER_FORECAST
    - WEATHER_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: content
        source_path: content
    integers:
      - index: 0
        name: probability_x10000
        source_path: probability
        multiplier: 10000

rate_limit_per_sec: 2
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30
