[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oathcast"
version = "0.1.0"
description = "Provider-neutral weather forecast adapters and local scoring harness for OathCast."
requires-python = ">=3.11"

[project.optional-dependencies]
logo-tools = ["Pillow>=12.2,<13"]
registration-tools = ["PyYAML>=6.0.2,<7"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
oathcast = ["assets/*.webp"]

[tool.setuptools.packages.find]
where = ["src"]
