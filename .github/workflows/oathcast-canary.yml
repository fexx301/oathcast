name: OathCast public canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: oathcast-public-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canary secret
        env:
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          if [ -z "$OATHCAST_MINER_API_KEY" ]; then
            echo "::error::OATHCAST_MINER_API_KEY is not configured; the public Miner cannot be verified."
            exit 1
          fi
      - name: Verify public Miner
        env:
          OATHCAST_PUBLIC_URL: https://oathcastcourt.duckdns.org
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          PYTHONPATH=src python3 scripts/public_canary.py \
            --expected-release-id 2026-08-12-hardened-v6 \
            --expected-source-sha256 2bc559e5673297b84e119ac03c0b63304638c13c6ee985ab42a9bd44dbfb4a66 \
            --expected-image-digest sha256:679b5dc3960757061e2a56d56cafc1b36176bb560e8dca78f3eb05308029e285 \
            --require-receipt-write-probe
