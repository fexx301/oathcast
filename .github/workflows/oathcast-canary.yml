name: OathCast public canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: oathcast-public-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canary secret
        id: secret
        env:
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          if [ -z "$OATHCAST_MINER_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OATHCAST_MINER_API_KEY is not configured; canary skipped safely."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify public Miner
        if: steps.secret.outputs.configured == 'true'
        env:
          OATHCAST_PUBLIC_URL: https://oathcastcourt.duckdns.org
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          PYTHONPATH=src python3 scripts/public_canary.py \
            --expected-release-id 2026-08-10-hardened-v5 \
            --expected-source-sha256 8b1788cae3c43bcadc03a7e1d9c5b390553fd7798b587e7a3b989ed833a10d46 \
            --expected-image-digest sha256:22a7c7893e2339cae070de9b2676845684008a438133eb69a098e914c4f96b3f
