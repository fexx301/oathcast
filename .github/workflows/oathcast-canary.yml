name: OathCast public canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: oathcast-public-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canary secret
        env:
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          if [ -z "$OATHCAST_MINER_API_KEY" ]; then
            echo "::error::OATHCAST_MINER_API_KEY is not configured; the public Miner cannot be verified."
            exit 1
          fi
      - name: Verify public Miner
        env:
          OATHCAST_PUBLIC_URL: https://oathcastcourt.duckdns.org
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          PYTHONPATH=src python3 scripts/public_canary.py \
            --expected-release-id 2026-08-16-route-v7 \
            --expected-source-sha256 3789e1ce6903c227e96869f29e570a822b93c59fe860243d840a3f43b6498557 \
            --expected-image-digest sha256:8bee7d497c0182b8899ad6ebbe162e89296d732311801edeaa26885665db4fac \
            --require-receipt-write-probe
