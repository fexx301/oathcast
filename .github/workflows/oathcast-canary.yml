name: OathCast public canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: oathcast-public-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canary secret
        env:
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          if [ -z "$OATHCAST_MINER_API_KEY" ]; then
            echo "::error::OATHCAST_MINER_API_KEY is not configured; the public Miner cannot be verified."
            exit 1
          fi
      - name: Verify public Miner
        env:
          OATHCAST_PUBLIC_URL: https://oathcastcourt.duckdns.org
          OATHCAST_MINER_API_KEY: ${{ secrets.OATHCAST_MINER_API_KEY }}
        run: |
          PYTHONPATH=src python3 scripts/public_canary.py \
            --expected-release-id 2026-08-17-temperature-v8 \
            --expected-source-sha256 edeeaacf470b2207f6bbd8439e0720eff0459d9ca5fe214bc3a09d48ae0c639c \
            --expected-image-digest sha256:ae1fff9db3317cd0f6a9d23772df62d93195bd814359e9a3c8d9b21aa0850672 \
            --require-receipt-write-probe \
            --require-temperature-window
