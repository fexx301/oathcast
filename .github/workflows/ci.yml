name: OathCast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and scripts
        run: python -W error::ResourceWarning -m compileall -q src scripts tests
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate local contracts
        run: |
          PYTHONPATH=src python scripts/validate_miner_drafts.py
          PYTHONPATH=src python scripts/validate_observations.py fixtures/observation_export.json
      - name: Check repository whitespace
        run: git diff --check
