name: OathCast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oathcast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -e '.[registration-tools]'
      - name: Compile source and scripts
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
      - name: Validate local contracts
        run: |
          PYTHONPATH=src python scripts/validate_miner_drafts.py
          PYTHONPATH=src python scripts/validate_observations.py fixtures/observation_export.json
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Check pushed whitespace
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --check "$EMPTY_TREE" "${{ github.sha }}"
          else
            git diff --check "$BEFORE_SHA" "${{ github.sha }}"
          fi

  wasm-scorer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: scoring-modules/oathcast-weather/go-tester/go.sum
      - name: Check Rust formatting
        run: cargo fmt --manifest-path scoring-modules/oathcast-weather/rust-module/Cargo.toml -- --check
      - name: Lint WASM target
        run: cargo clippy --manifest-path scoring-modules/oathcast-weather/rust-module/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Lint native tests
        run: cargo clippy --manifest-path scoring-modules/oathcast-weather/rust-module/Cargo.toml --all-targets -- -D warnings
      - name: Run native scoring-core tests
        run: cargo test --manifest-path scoring-modules/oathcast-weather/rust-module/Cargo.toml
      - name: Build locked release WASM
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path scoring-modules/oathcast-weather/rust-module/Cargo.toml
      - name: Run wazero ABI and scoring tests
        working-directory: scoring-modules/oathcast-weather/go-tester
        run: go test -count=1 -mod=readonly ./...
